name: 機能追加
description: 新しい機能のリクエストやタスク
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何を実装したいか簡潔に説明してください
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 詳細
      description: 実装の詳細や要件を記述してください
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: このチケットが完了したと判断できる条件を記述してください
    validations:
      required: true
